name: Build Xiling Worldbook

on:
  push:
    branches: [main]
    paths:
      - 'assembly/worldbook/build_character_book.py'
      - 'assembly/worldbook/build_character_book_v1_1.py'
      - 'assembly/worldbook/trigger_aliases.json'
      - 'worldbook/settings/**'
      - 'worldbook/characters/**'
      - 'worldbook/abilities/**'
      - 'worldbook/timeline/**'
      - 'worldbook/locations/**'
      - '.github/workflows/build-worldbook.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Build character_book
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p assembly/worldbook/dist
          python assembly/worldbook/build_character_book_v1_1.py | tee assembly/worldbook/dist/希灵帝国_worldbook_build_report.json

      - name: Validate generated JSON
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p = Path('assembly/worldbook/dist/希灵帝国_character_book.json')
          book = json.loads(p.read_text(encoding='utf-8'))
          assert book['name'] == '希灵帝国'
          assert len(book['entries']) == 318, len(book['entries'])
          assert sum(1 for e in book['entries'] if e['comment'].startswith('时间线｜')) == 13
          assert sum(1 for e in book['entries'] if e['comment'].startswith('时间线｜') and e['enabled']) == 1
          blue10 = [e for e in book['entries'] if e['comment'] == '蓝灯｜陈俊第一人称叙事视角']
          assert len(blue10) == 1
          assert blue10[0]['enabled'] is True and blue10[0]['constant'] is True and blue10[0]['selective'] is False
          bad = ('[initvar]', '变量初始化', '变量列表', '变量更新规则', 'UpdateVariable', 'MagVarUpdate')
          assert not any(any(x in e['comment'] for x in bad) for e in book['entries'])
          assert all(e['extensions']['prevent_recursion'] is False for e in book['entries'])
          assert all(e['extensions']['exclude_recursion'] is False for e in book['entries'])
          print('PASS: 318 entries / BLUE10 constant / 13 timeline / 1 enabled timeline / NO MVU / ordinary recursion policy')
          PY

      - name: Commit generated worldbook
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assembly/worldbook/dist/
          if git diff --cached --quiet; then
            echo 'Generated outputs unchanged.'
            exit 0
          fi
          git commit -m 'worldbook: generate fullstack no-MVU character_book [skip ci]'
          git push origin HEAD:main
