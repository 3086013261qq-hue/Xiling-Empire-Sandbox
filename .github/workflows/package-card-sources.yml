name: Package Xiling Card Sources

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/package-card-sources.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Upload exact final JSON and cover
        uses: actions/upload-artifact@v4
        with:
          name: xiling-card-sources
          path: |
            assembly/card/dist/希灵帝国_最终.json
            assembly/card/media/希灵帝国_正式封面.png
          if-no-files-found: error
          compression-level: 0
          retention-days: 1
